<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crosshair"></div>
    <div id="error-message" style="display: none; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: red; color: white; padding: 20px; z-index: 1000; text-align: center;">
        <p>エラー: スクリプトが読み込めませんでした。</p>
        <p>ローカルサーバーを使用してください (例: python -m http.server)</p>
        <p>Error: Script failed to load. Please use a local server.</p>
    </div>
    <script>
        window.addEventListener('error', function(e) {
            // Check if the error is related to module loading (simplified check)
            // Or simply show the error if the game doesn't start
            console.error("Global error caught:", e.message);
            // If the error message suggests a script load failure or if body is not populated
            // But 'error' on window usually catches execution errors.
            // 'error' on script tags is better for load failures.
        }, true); // Use capture to catch resource loading errors
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js" onerror="document.getElementById('error-message').style.display='block'"></script>
</body>
</html>
