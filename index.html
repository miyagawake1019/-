<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マウンテンバイクゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="crosshair" style="display:none;"></div> <!-- Hide crosshair as it's not needed for biking -->
    <div id="error-message" style="display: none; position: absolute; top: 10%; left: 50%; transform: translateX(-50%); background: red; color: white; padding: 20px; z-index: 1000; text-align: center;">
        <p>エラー: スクリプトが読み込めませんでした。</p>
        <p>ローカルサーバーを使用してください (例: python -m http.server)</p>
        <p>Error: Script failed to load. Please use a local server.</p>
    </div>
    <div id="instructions">
        <h1>マウンテンバイクゲーム</h1>
        <p>クリックして開始</p>
        <p>------------------</p>
        <p>上矢印: 加速</p>
        <p>下矢印: バック / ブレーキ</p>
        <p>左矢印: 左に曲がる</p>
        <p>右矢印: 右に曲がる</p>
        <p>楽しい木のコースで遊ぼう！</p>
        <p>でっかいジャンプ台もあるよ！</p>
    </div>
    <script>
        window.addEventListener('error', function(e) {
            console.error("Global error caught:", e.message);
        }, true);
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js" onerror="document.getElementById('error-message').style.display='block'"></script>
</body>
</html>
